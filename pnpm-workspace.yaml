packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2201.3'
  - '@angular-devkit/core@22.1.3'
  - '@angular-devkit/schematics@22.1.3'
  - '@angular/build@22.1.3'
  - '@angular/cli@22.1.3'
  - '@schematics/angular@22.1.3'
