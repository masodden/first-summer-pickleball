packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  # GHSA-2v37-7h3g-55p8: Vite/Postcss тянут 3.3.17; патч только в 3.3.18.
  'nanoid@<3.3.18': '3.3.18'

allowBuilds:
