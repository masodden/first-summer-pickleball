<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="First Summer Pickleball">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc7853"/>
      <stop offset="1" stop-color="#a8482b"/>
    </linearGradient>
    <linearGradient id="ball" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#d2ef62"/>
      <stop offset="1" stop-color="#a8cc19"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.26" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#clay)"/>
  <circle cx="256" cy="238" r="150" fill="url(#ball)"/>
  <circle cx="256" cy="238" r="150" fill="url(#sheen)"/>

  <g fill="#7fa010" opacity="0.72">
    <circle cx="256" cy="150" r="17"/>
    <circle cx="330" cy="196" r="17"/>
    <circle cx="330" cy="282" r="17"/>
    <circle cx="256" cy="326" r="17"/>
    <circle cx="182" cy="282" r="17"/>
    <circle cx="182" cy="196" r="17"/>
    <circle cx="256" cy="238" r="17"/>
  </g>

  <rect x="146" y="418" width="220" height="20" rx="10" fill="#ef4f9d"/>
</svg>
